name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: catcar-azure
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    name: Verify release ancestry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify tag and pinned ancestors
        run: bash scripts/verify-release.sh --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --repository-root "$GITHUB_WORKSPACE"

  validate:
    name: Validate release candidate
    needs: [verify-release]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read

  azure:
    name: Deploy Azure
    needs: [validate]
    runs-on: ubuntu-latest
    environment: azure
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_TF_STATE_RG: ${{ vars.AZURE_TF_STATE_RG }}
      AZURE_TF_STATE_STORAGE_ACCOUNT: ${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ vars.TF_BACKEND_CONTAINER }}
      APIM_PUBLISHER_NAME: ${{ vars.APIM_PUBLISHER_NAME }}
      APIM_PUBLISHER_EMAIL: ${{ vars.APIM_PUBLISHER_EMAIL }}
      CATCAR_ALERT_EMAIL: ${{ vars.CATCAR_ALERT_EMAIL }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      POSTGRES_AUTH_READONLY_PASSWORD: ${{ secrets.POSTGRES_AUTH_READONLY_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CUSTOMER_JWT_SIGNING_KEY: ${{ secrets.CUSTOMER_JWT_SIGNING_KEY }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      SMOKE_CUSTOMER_EMAIL: ${{ secrets.SMOKE_CUSTOMER_EMAIL }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY_SLUG: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-images
          path: artifacts/release/release-images
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: artifacts/release/release-evidence
      - name: Verify validated image archives
        run: |
          set -euo pipefail
          cd artifacts/release/release-images
          sha256sum -c SHA256SUMS
          evidence=../release-evidence/release-evidence.json
          test "$(jq -r '.dirty' "$evidence")" = false
          test "$(jq -r '.platformSha' "$evidence")" = "$GITHUB_SHA"
          jq -e '.checks | .componentChecks == true and .pinnedIntegration == true and .trivy == true and all(.[]; . == true)' "$evidence" >/dev/null
          source "$GITHUB_WORKSPACE/scripts/lib/image-digests.sh"
          test "$(image_archive_config_digest api.tar)" = "$(jq -r '.imageConfigDigests.api' "$evidence")"
          test "$(image_archive_config_digest auth-function.tar)" = "$(jq -r '.imageConfigDigests.authFunction' "$evidence")"
          docker load -i api.tar
          docker load -i auth-function.tar
          for component in catcar-app catcar-auth-function catcar-database-infra catcar-kubernetes-infra; do
            test "$(jq -r --arg component "$component" '.componentShas[$component]' "$evidence")" = "$(git -C "$GITHUB_WORKSPACE" rev-parse "HEAD:$component")"
          done
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: azure/use-kubelogin@v1.3
        with:
          kubelogin-version: v0.1.7
      - name: Authenticate with Azure OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy in dependency order
        run: |
          set -euo pipefail
          for phase in foundation database api function alerts-smoke; do
            bash scripts/deploy-azure.sh --phase "$phase" --artifacts-dir "$GITHUB_WORKSPACE/artifacts/release"
          done
      - name: Upload release manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: artifacts/release/release-manifest.json
          if-no-files-found: warn
