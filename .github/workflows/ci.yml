name: Platform CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  component-checks:
    name: Component Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify checks for pinned commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-component-checks.sh --repository-root "$GITHUB_WORKSPACE" --mode "${{ github.event_name == 'pull_request' && 'pull-request' || 'release' }}"

  pinned-integration:
    name: Pinned Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Build pinned services and platform AppHost
        run: |
          dotnet build catcar-os-service/CatCar.slnx -c Release
          dotnet build catcar-billing-service/CatCar.Billing.slnx -c Release
          dotnet build catcar-execution-service/CatCar.Execution.slnx -c Release
          dotnet build aspire/CatCar.AppHost -c Release

  release-images:
    name: Release Images
    needs: [component-checks, pinned-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Build pinned release images
        run: bash scripts/build-release-images.sh build
      - name: Scan approved API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          input: artifacts/release-images/api.tar
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan approved Function image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          input: artifacts/release-images/auth-function.tar
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Record release evidence after successful scans
        run: bash scripts/build-release-images.sh evidence
      - uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: artifacts/release-images/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: artifacts/release-evidence/release-evidence.json
          if-no-files-found: error
